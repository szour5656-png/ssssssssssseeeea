<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="https://ic-cdn.flipboard.com/flipboard.com/f882611fcbfbed660169b99590b0c0f7efec883c/_xlarge.webp">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love & War</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: #111;
      font-family: Arial, sans-serif;
    }
    .gallery-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      max-width: 1100px;
      margin: 0 auto;
    }
    .video-card {
      display: block;
      position: relative;
      overflow: hidden;
      border-radius: 10px;
      background: #222;
    }
    .video-thumbnail {
      display: block;
      width: 100%;
      height: 220px;
      object-fit: cover;
    }
    .play-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,.12);
    }
    .play-button {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: rgba(0,0,0,.65);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .play-icon {
      width: 0;
      height: 0;
      margin-left: 5px;
      border-top: 12px solid transparent;
      border-bottom: 12px solid transparent;
      border-left: 18px solid white;
    }
  </style>
</head>
<body>
  <div class="gallery-container">
    <a href="https://indefinitelynutmegbile.com/ji3cya2qdx?key=29cb5eb4cd836fe4e0dd2e18648566e4" class="video-card">
      <img src="https://raw.githubusercontent.com/rehanqadirzr-alt/raha2/refs/heads/main/1.gif"
           alt="Video 1" class="video-thumbnail">
      <div class="play-overlay"><div class="play-button"><div class="play-icon"></div></div></div>
    </a>

    <a href="https://indefinitelynutmegbile.com/ji3cya2qdx?key=29cb5eb4cd836fe4e0dd2e18648566e4" class="video-card">
      <img src="https://raw.githubusercontent.com/rehanqadirzr-alt/gifs/refs/heads/main/4.gif"
           alt="Video 2" class="video-thumbnail">
      <div class="play-overlay"><div class="play-button"><div class="play-icon"></div></div></div>
    </a>

    <a href="https://indefinitelynutmegbile.com/ji3cya2qdx?key=29cb5eb4cd836fe4e0dd2e18648566e4" class="video-card">
      <img src="https://raw.githubusercontent.com/rehanqadirzr-alt/gifs/refs/heads/main/6.gif"
           alt="Video 3" class="video-thumbnail">
      <div class="play-overlay"><div class="play-button"><div class="play-icon"></div></div></div>
    </a>
  </div>
</body>
</html>
